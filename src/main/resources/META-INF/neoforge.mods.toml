modLoader="javafml"
loaderVersion="${loader_range}"
issueTrackerURL="https://github.com/Sukvii/TinkersConstruct-1.21.1/issues"
logoFile="logo.png"
license="MIT"

[[mods]]
    modId="tconstruct"
    version="${version}"
    displayName="Tinkers' Construct"
    authors="Sukvii"
    enumExtensions="META-INF/enumextensions.json"
    description='''
Unofficial NeoForge port of Tinkers' Construct for Minecraft 1.21.1, based on Tinkers' Construct 3.12.0.220 for Minecraft 1.20.1.
    '''

[[dependencies.tconstruct]]
    modId="neoforge"
    type="required"
    versionRange="${neo_range}"
    ordering="NONE"
    side="BOTH"

[[dependencies.tconstruct]]
    modId="minecraft"
    type="required"
    versionRange="${minecraft_range}"
    ordering="NONE"
    side="BOTH"

[[dependencies.tconstruct]]
    modId="mantle"
    type="required"
    versionRange="${mantle_range}"
    ordering="AFTER"
    side="BOTH"

[[dependencies.tconstruct]]
    modId="jei"
    type="optional"
    versionRange="${jei_range}"
    ordering="NONE"
    side="BOTH"
